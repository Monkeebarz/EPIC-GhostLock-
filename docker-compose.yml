services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ghostlock
      POSTGRES_PASSWORD: ghostlock
      POSTGRES_DB: ghostlock
    ports: ["5432:5432"]
    volumes: ["ghostlock_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  bot:
    build: .
    env_file: .env
    depends_on: [postgres, redis]
    ports: ["3000:3000"]
volumes:
  ghostlock_pg:
